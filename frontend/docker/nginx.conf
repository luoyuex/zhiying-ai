# 智盈 AI 容器内站点配置
#   /          官网 index.html
#   /app/*     Vue 工作台（深链回退 app.html）
#   /api/*     反代 api:8010
#   /health    健康检查
#
# 同域部署：刷新 Cookie 是 SameSite=Lax，API 不能拆到独立域名。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # Docker 内置 DNS：api 容器重启换 IP 后也能自动解析
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8010;

    # /app 统一补斜杠
    location = /app {
        return 302 /app/$is_args$args;
    }

    # 工作台深链全部回退到 app.html
    location ^~ /app/ {
        try_files $uri /app.html;
    }

    # API 反代。SSE 进度必须关缓冲，否则会等任务结束才一次性输出
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 容器内 Nginx 是唯一入口时覆盖 XFF，防止伪造 IP 绕过验证码限流；
        # 如果前面还有 CDN / 负载均衡，请先配好 realip 模块，否则会误伤 IP 限流。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    # Vite 产物带内容哈希，可长缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    # HTML 不能缓存，否则发布后仍引用旧资源
    location = /index.html {
        expires -1;
    }
    location = /app.html {
        expires -1;
    }

    # 其余路径先找静态文件，找不到回官网
    location / {
        try_files $uri $uri/ /index.html;
    }
}
